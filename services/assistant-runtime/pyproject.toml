[project]
name = "veritymesh-assistant-runtime"
version = "0.0.0"
description = "VerityMesh constrained online AI runtime"
requires-python = "==3.12.*"
dependencies = [
    "fastapi==0.139.0",
    "pydantic==2.13.4",
    "uvicorn[standard]==0.51.0",
]

[build-system]
requires = ["hatchling==1.31.0"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/veritymesh_assistant_runtime"]
