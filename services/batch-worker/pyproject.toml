[project]
name = "veritymesh-batch-worker"
version = "0.0.0"
description = "VerityMesh knowledge processing worker"
requires-python = "==3.12.*"
dependencies = [
    "alembic==1.18.5",
    "celery==5.6.3",
    "pgvector==0.5.0",
    "psycopg==3.3.4",
    "redis==7.4.1",
    "sqlalchemy==2.0.51",
]

[build-system]
requires = ["hatchling==1.31.0"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/veritymesh_batch_worker"]
