spring.application.name=platform-api
spring.main.web-application-type=servlet
spring.jpa.open-in-view=false
spring.flyway.enabled=false

# Source Storage is fail-closed until credentials are injected by the runtime.
# The defaults target the local MinIO endpoint when explicitly enabled.
veritymesh.source-storage.enabled=${VERITYMESH_SOURCE_STORAGE_ENABLED:false}
veritymesh.source-storage.endpoint=${VERITYMESH_SOURCE_STORAGE_ENDPOINT:http://localhost:19000}
veritymesh.source-storage.region=${VERITYMESH_SOURCE_STORAGE_REGION:us-east-1}
veritymesh.source-storage.bucket=${VERITYMESH_SOURCE_STORAGE_BUCKET:veritymesh-source}
veritymesh.source-storage.access-key=${VERITYMESH_SOURCE_STORAGE_ACCESS_KEY:}
veritymesh.source-storage.secret-key=${VERITYMESH_SOURCE_STORAGE_SECRET_KEY:}
veritymesh.source-storage.presign-duration=${VERITYMESH_SOURCE_STORAGE_PRESIGN_DURATION:15m}
veritymesh.source-storage.path-prefix=${VERITYMESH_SOURCE_STORAGE_PATH_PREFIX:source-zone}
veritymesh.source-storage.force-path-style=${VERITYMESH_SOURCE_STORAGE_FORCE_PATH_STYLE:true}

# Kafka publishing remains disabled until a broker and topic contract are configured.
veritymesh.outbox.publisher.enabled=${VERITYMESH_OUTBOX_PUBLISHER_ENABLED:false}
veritymesh.outbox.publisher.bootstrap-servers=${VERITYMESH_KAFKA_BOOTSTRAP_SERVERS:localhost:19092}
veritymesh.outbox.publisher.source-revision-topic=${VERITYMESH_SOURCE_REVISION_TOPIC:veritymesh.source-revision-submitted}
veritymesh.outbox.publisher.poll-interval-ms=${VERITYMESH_OUTBOX_PUBLISHER_POLL_INTERVAL_MS:1000}
veritymesh.outbox.publisher.batch-size=${VERITYMESH_OUTBOX_PUBLISHER_BATCH_SIZE:100}
veritymesh.outbox.publisher.send-timeout=${VERITYMESH_OUTBOX_PUBLISHER_SEND_TIMEOUT:10s}
